  n_initializations: 3
  replicates: 5
  configurations: [1, 2, 3, 4, 5, 6, 7, 8]

gradient:
  modes: [statevector_exact, finite_shot_conditional, finite_shot_end_to_end]

stats:
  bootstrap:
    iterations: 20
    min_success_fraction: 0.5
