# Development configuration: full depth/budget sweep, reduced replicate and
# initialization counts, dev-scale bootstrap. Useful for iterating on the
# analysis pipeline without publication-scale runtime.
name: dev
seed_root: 20260726

task:
  n_qubits: 4
  J: 1.0
  h: 0.5

circuit:
  depths: [1, 2, 3, 4, 6]

budget:
  values: [250, 500, 1000, 2000]

design:
  n_initializations: 12
  replicates: 30
  configurations: [1, 2, 3, 4, 5, 6, 7, 8]

gradient:
  modes: [statevector_exact, finite_shot_conditional, finite_shot_end_to_end]

stats:
  bootstrap:
    iterations: 200
    min_success_fraction: 0.9
