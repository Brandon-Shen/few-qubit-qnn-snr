name: tests

on:
  push:
    branches: [main, submission-manuscript-revision-20260802]
    tags: [sncs-submission-v*]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Check manuscript freeze
        run: python scripts/check_manuscript_frozen_values.py --output verification/ci_manuscript_check.json
      - name: Check checksum inventories
        run: python scripts/regenerate_checksum_inventories.py --check
      - name: Smoke-run the CLI end to end
        if: runner.os == 'Linux'
        run: python -m qnn_snr run-all --config configs/smoke.yaml --iterations 5 --pointwise-bootstrap-iterations 10
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p verification/ci_logs
          git ls-files --eol > verification/ci_logs/git-eol.txt
          python --version > verification/ci_logs/python-version.txt 2>&1
          python -m pip freeze > verification/ci_logs/packages.txt
          git rev-parse HEAD > verification/ci_logs/commit.txt
          cp verification/ci_manuscript_check.json verification/ci_logs/ 2>/dev/null || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-validation-${{ runner.os }}
          path: verification/ci_logs
